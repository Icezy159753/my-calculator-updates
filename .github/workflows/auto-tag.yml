name: auto-tag-on-version-change

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Detect version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for Main_Program.py changes..."
          if git diff --name-only HEAD~1 HEAD | grep -q "Main_Program.py"; then
            echo "Main_Program.py changed"
          else
            echo "Main_Program.py not changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking for CURRENT_VERSION changes..."
          if git diff HEAD~1 HEAD -- Main_Program.py | grep -q "CURRENT_VERSION"; then
            echo "CURRENT_VERSION changed"
          else
            echo "CURRENT_VERSION not changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Extracting version..."
          version=$(python -c "import re; f=open('Main_Program.py','r',encoding='utf-8').read(); m=re.search(r'^CURRENT_VERSION\s*=\s*\"([^\"]+)\"', f, re.M); print(m.group(1) if m else '')")
          if [ -z "$version" ]; then
            echo "No version found"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. Skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
