name: build-windows-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      preview_version:
        description: 'Next version to validate (does not publish a release)'
        required: true
        default: '1.1.101'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_ttk.lock.txt

      - name: Select build components
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = "${{ github.ref_name }}".TrimStart('v')
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $releaseVersion = "${{ inputs.preview_version }}" }
          python release_build.py prepare --repo "${{ github.repository }}" --version $releaseVersion

      - name: Ensure pip cache directory for reuse-only builds
        run: python -c "import pathlib, subprocess, sys; pathlib.Path(subprocess.check_output([sys.executable, '-m', 'pip', 'cache', 'dir'], text=True).strip()).mkdir(parents=True, exist_ok=True)"

      - name: Run release tests
        run: python -m unittest test_autolychee_packaging test_update_cache test_release_files test_release_build -v

      - name: Install dependencies
        shell: pwsh
        run: |
          if ("${{ steps.plan.outputs.main }}" -eq "true") {
            python -m pip install -r requirements_ttk.lock.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m pip install PyQt6==6.9.0 PyQt6-Qt6==6.9.0 PyQt6_sip==13.10.2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ("${{ steps.plan.outputs.autolychee }}" -eq "true") {
            python -m pip install PySide6==6.9.0 pywinauto==0.6.9 comtypes==1.4.10 pywin32==310 openpyxl==3.1.5 Pillow==10.4.0 lxml==5.4.0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ("${{ steps.plan.outputs.updater }}" -eq "true") {
            python -m pip install requests==2.32.3 psutil==7.0.0 bsdiff4==1.2.6
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ("${{ steps.plan.outputs.main }}" -eq "true" -or "${{ steps.plan.outputs.autolychee }}" -eq "true" -or "${{ steps.plan.outputs.updater }}" -eq "true") {
            python -m pip install pyinstaller==6.21.0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Restore Test3.json from secret
        shell: pwsh
        env:
          TEST3_JSON_B64: ${{ secrets.TEST3_JSON_B64 }}
        run: |
          if (-not $env:TEST3_JSON_B64) {
            Write-Error "Missing secret TEST3_JSON_B64"
            exit 1
          }
          $bytes = [System.Convert]::FromBase64String($env:TEST3_JSON_B64)
          [System.IO.File]::WriteAllBytes("Test3.json", $bytes)

      - name: Restore OpenRouter config from secret
        shell: pwsh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if (-not $env:OPENROUTER_API_KEY) {
            Write-Error "Missing secret OPENROUTER_API_KEY"
            exit 1
          }
          $json = @{ api_key = $env:OPENROUTER_API_KEY } | ConvertTo-Json
          Set-Content -Path "openrouter.json" -Value $json -Encoding UTF8

      - name: Build Auto Lychee EXE
        if: steps.plan.outputs.autolychee == 'true'
        run: |
          pyinstaller --noconfirm AutoLychee.spec

      - name: Build EXE
        if: steps.plan.outputs.main == 'true'
        run: |
          pyinstaller Main_Program.spec

      - name: Assemble release
        run: python release_build.py assemble

      - name: Verify packaged Auto Lychee EXE
        shell: pwsh
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
          AUTOLYCHEE_DATA: ${{ runner.temp }}/autolychee-smoke
        run: |
          @'
          from pathlib import Path
          import re
          import subprocess
          import sys

          sys.stdout.reconfigure(encoding="utf-8", errors="backslashreplace")
          sys.stderr.reconfigure(encoding="utf-8", errors="backslashreplace")

          def run(command, timeout, **kwargs):
              # One-file exes spawn a child that keeps the pipes open, so kill the whole tree on timeout.
              process = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                         stderr=subprocess.PIPE, text=True, encoding="utf-8", errors="replace")
              try:
                  stdout, stderr = process.communicate(kwargs.get("input", ""), timeout=timeout)
              except subprocess.TimeoutExpired:
                  subprocess.run(["taskkill", "/F", "/T", "/PID", str(process.pid)])
                  raise SystemExit(f"Timed out after {timeout}s: {command}")
              return subprocess.CompletedProcess(command, process.returncode, stdout, stderr)

          executable = "dist/Main_Program/_internal/AutoLychee/AutoLychee.exe"
          result = run([executable, "--smoke-test"], timeout=120)
          print(result.stdout)
          print(result.stderr)
          if result.returncode != 0 or "Auto Lychee GUI smoke test OK" not in result.stdout:
              raise SystemExit("Frozen Auto Lychee smoke test failed")
          post = run([executable, "--post"], timeout=60, input="")
          print(post.stdout)
          print(post.stderr)
          if post.returncode != 0:
              raise SystemExit("Frozen Auto Lychee post-process startup failed")
          routed = run(["dist/Main_Program/Main_Program.exe", "--run-module",
                        "158_AutoLychee_OneFile", "--entry-point", "run_this_app", "--check"], timeout=120)
          print(routed.stdout)
          print(routed.stderr)
          source = Path("All_Programs/158_AutoLychee_OneFile.py").read_text(encoding="utf-8-sig")
          section_count = len(re.findall(r"^# ====== MODULE: [A-Za-z_]\w* ======$", source, re.M))
          if not section_count or routed.returncode != 0 or f"{section_count} sections OK" not in routed.stdout:
              raise SystemExit("Frozen Launcher Auto Lychee routing failed")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build updater
        if: steps.plan.outputs.updater == 'true'
        run: |
          pyinstaller --onefile --windowed --name updater --icon="setting.ico" --add-data "setting.ico;." updater.py

      - name: Package full and file updates
        run: python release_build.py package

      - name: Verify file update transition
        run: |
          python verify_file_transition.py

      - name: Upload release assets
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Main_Program.zip
            dist/Main_Program_full_*.zip
            dist/Main_Program_files_*.zip
            dist/release_manifest.json
            dist/updater.exe

      - name: Notify Telegram
        if: success() && github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: pwsh
        run: |
          if (-not $env:TELEGRAM_BOT_TOKEN -or -not $env:TELEGRAM_CHAT_ID) {
            Write-Host "Telegram secrets missing; skipping notification."
            exit 0
          }
          $tag = "${{ github.ref_name }}"
          $msg = "✅ Build สำเร็จ: $tag พร้อมใช้งานแล้ว อัปเดตได้เลย"
          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $msg
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" -ContentType "application/json" -Body $body
